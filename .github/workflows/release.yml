name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: sshmcp
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: sshmcp.exe
            archive_ext: zip
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: sshmcp
            archive_ext: tar.gz
            apt_package: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            ar: aarch64-linux-gnu-ar

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt_package != ''
        run: sudo apt-get update && sudo apt-get install -y "${{ matrix.apt_package }}"

      - name: Configure cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=${{ matrix.ar }}" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare package variables
        shell: bash
        run: |
          version="${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            test "$version" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          PACKAGE="sshmcp-${version}-${{ matrix.target }}"
          echo "PACKAGE=${PACKAGE}" >> "$GITHUB_ENV"
          echo "ARCHIVE_EXT=${{ matrix.archive_ext }}" >> "$GITHUB_ENV"
          echo "BIN_PATH=target/${{ matrix.target }}/release/${{ matrix.binary }}" >> "$GITHUB_ENV"

      - name: Stage package contents
        shell: bash
        run: |
          mkdir -p "dist/${PACKAGE}/examples"
          cp "${BIN_PATH}" "dist/${PACKAGE}/"
          cp README.md README.zh-CN.md LICENSE "dist/${PACKAGE}/"
          cp examples/profiles.yaml "dist/${PACKAGE}/examples/"

      - name: Archive package (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"

      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:PACKAGE/*" -DestinationPath "dist/$env:PACKAGE.zip" -Force

      - name: Generate package checksum
        shell: bash
        run: |
          (cd dist && sha256sum "${PACKAGE}.${ARCHIVE_EXT}" > "${PACKAGE}.${ARCHIVE_EXT}.sha256")

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/${{ env.PACKAGE }}.${{ matrix.archive_ext }}
            dist/${{ env.PACKAGE }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS

  docker:
    name: publish-worker-image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sshmcp/sshmcp:${{ github.ref_name }}
            ghcr.io/sshmcp/sshmcp:latest
