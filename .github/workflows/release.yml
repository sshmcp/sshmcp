name: release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: sshmcp
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: sshmcp.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Check Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare package variables
        shell: bash
        run: |
          version="${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            test "$version" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          PACKAGE="sshmcp-${version}-${{ matrix.target }}"
          echo "PACKAGE=${PACKAGE}" >> "$GITHUB_ENV"
          echo "ARCHIVE_EXT=${{ matrix.archive_ext }}" >> "$GITHUB_ENV"
          echo "BIN_PATH=target/${{ matrix.target }}/release/${{ matrix.binary }}" >> "$GITHUB_ENV"

      - name: Stage package contents
        shell: bash
        run: |
          mkdir -p "dist/${PACKAGE}/examples"
          cp "${BIN_PATH}" "dist/${PACKAGE}/"
          cp README.md README.zh-CN.md LICENSE "dist/${PACKAGE}/"
          cp examples/profiles.yaml "dist/${PACKAGE}/examples/"

      - name: Archive package (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"

      - name: Archive package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:PACKAGE/*" -DestinationPath "dist/$env:PACKAGE.zip" -Force

      - name: Generate package checksum
        shell: bash
        run: |
          (cd dist && sha256sum "${PACKAGE}.${ARCHIVE_EXT}" > "${PACKAGE}.${ARCHIVE_EXT}.sha256")

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/${{ env.PACKAGE }}.${{ matrix.archive_ext }}
            dist/${{ env.PACKAGE }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
