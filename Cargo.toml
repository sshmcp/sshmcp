[package]
name = "sshmcp"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sshmcp/sshmcp"
readme = "README.md"
description = "Secure SSH MCP gateway for AI agents with policy, approval, audit, and reusable SSH sessions."

[dependencies]
base64 = "0.22"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
russh = { version = "0.60", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tempfile = "3"
url = "2"
uuid = { version = "1.15", features = ["serde", "v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rand = "0.10"
rsa = "0.10.0-rc.17"
